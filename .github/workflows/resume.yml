# Rebuilds public/resume.pdf whenever its inputs change on main, then commits
# it back. That bot commit is what Vercel deploys with the fresh PDF. Pushes
# made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
name: Regenerate resume

on:
  push:
    branches: [main]
    paths:
      - src/lib/resume_data.json
      - public/resume_gen/scripts/generate_resume.py
      - public/resume_gen/scripts/generate_pdf.py
      - public/resume_gen/scripts/check_requirements.py
      - public/resume_gen/scripts/requirements.txt
      - public/resume_gen/templates/resume_template.html
      - .github/workflows/resume.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public/resume_gen/scripts/requirements.txt

      # The template sets Times New Roman, which Ubuntu doesn't ship. Without
      # it Chromium falls back to a different serif and the one-page scale drifts.
      - name: Install Microsoft core fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer
          fc-cache -f

      - name: Install Python requirements
        run: |
          pip install -r public/resume_gen/scripts/requirements.txt
          python -m playwright install --with-deps chromium

      # generate_resume.py only warns when the PDF step fails, so delete the old
      # PDF first and fail the job if no new one appears.
      - name: Generate resume
        run: |
          rm public/resume.pdf
          python public/resume_gen/scripts/generate_resume.py
          test -f public/resume.pdf

      - name: Commit regenerated PDF
        run: |
          if git diff --quiet -- public/resume.pdf; then
            echo "resume.pdf unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/resume.pdf
          git commit -m "Regenerate resume"
          git pull --rebase origin main
          git push origin HEAD:main
