# Rebuilds public/resume.pdf when the resume itself changes and commits it back
# to main. Vercel skips the push that changed it (see vercel.json's
# ignoreCommand and .github/scripts/resume_fingerprint.py) and deploys this
# Action's commit instead, so each push deploys once, with the right PDF.
#
# Runs on every push rather than filtering by path: the fingerprint check
# takes seconds, and Vercel and this Action must agree on what "the resume
# changed" means. If they disagreed, a push could be skipped by Vercel and
# never followed up here. Pushes made with GITHUB_TOKEN don't trigger
# workflows, so this can't loop.
name: Regenerate resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queue rather than cancel: each run checks out the latest main, so a queued
# run sees the previous run's commit and only rebuilds if still needed.
concurrency:
  group: resume
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether the resume changed
        id: check
        run: |
          if python .github/scripts/resume_fingerprint.py --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # The template sets Times New Roman, which Ubuntu doesn't ship. Without
      # it Chromium falls back to a different serif and the one-page scale drifts.
      - name: Install Microsoft core fonts
        if: steps.check.outputs.stale == 'true'
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer
          fc-cache -f

      - name: Install Python requirements
        if: steps.check.outputs.stale == 'true'
        run: |
          pip install -r public/resume_gen/scripts/requirements.txt
          python -m playwright install --with-deps chromium

      # generate_resume.py only warns when the PDF step fails, so delete the old
      # PDF first and fail the job if no new one appears.
      - name: Generate resume
        if: steps.check.outputs.stale == 'true'
        run: |
          rm -f public/resume.pdf
          python public/resume_gen/scripts/generate_resume.py
          test -f public/resume.pdf
          python .github/scripts/resume_fingerprint.py --write

      - name: Commit regenerated PDF
        if: steps.check.outputs.stale == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/resume.pdf .github/resume-fingerprint
          git commit -m "Regenerate resume"
          git pull --rebase origin main
          git push origin HEAD:main
